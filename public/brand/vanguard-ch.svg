<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" role="img" aria-label="Vanguard Properties — Chuck Heaver, REALTOR">
  <!-- Rebuilt approximation of the Vanguard Properties + Chuck Heaver lockup.
       Swap this file (same path) with the official asset for an exact match. -->
  <!-- Vanguard "V" emblem -->
  <g>
    <path d="M28 54 L60 54 L79 88 L98 54 L130 54 L79 148 Z" fill="#22365a"/>
    <path d="M98 54 L130 54 L79 148 L79 112 Z" fill="#33496e"/>
    <path d="M56 66 L72 66 L79 79 L86 66 L102 66 L79 108 Z" fill="#ffffff"/>
    <path d="M86 66 L102 66 L79 108 L79 94 Z" fill="#e7ebf1"/>
  </g>

  <!-- VANGUARD / PROPERTIES wordmark -->
  <g fill="#22365a" font-family="Arial, Helvetica, sans-serif" font-weight="500">
    <text x="158" y="82" font-size="42" letter-spacing="6" textLength="300" lengthAdjust="spacing">VANGUARD</text>
    <text x="158" y="134" font-size="42" letter-spacing="6" textLength="300" lengthAdjust="spacing">PROPERTIES</text>
  </g>

  <!-- CH monogram + name -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="492" y="140" font-size="128" fill="#2b4064">C</text>
    <text x="560" y="140" font-size="128" fill="#556a60">H</text>
    <text x="571" y="100" font-size="15" letter-spacing="3" font-weight="700"
          text-anchor="middle" fill="#22365a" font-family="Arial, Helvetica, sans-serif"
          paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">CHUCK&#160;HEAVER</text>
  </g>
</svg>
